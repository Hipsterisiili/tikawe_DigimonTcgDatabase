<html>

<head>

  </p>
  <p>
    <a href="/logout">Kirjaudu ulos</a>

    <body>
  <p>

  </p>
  <hr />
  {% endfor %}
</body>

  </p>
  {% else %}

  </p>
  {% endif %}

</html>
