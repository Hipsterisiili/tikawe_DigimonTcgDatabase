<!doctype html>
<html>
    <head>
        <title>
            Edit an existing card a card in {{ 'personal' if target=='personal'
            else 'global' }} collection
        </title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>

    <body>
        <form action="/edit_card" method="post">
            <input type="hidden" name="id" value="{{ id }}" />
            <input type="hidden" name="target" value="{{ target }}" />
            <p>
                Name of the card:
                <br />
                <textarea name="content" rows="3" cols="40">
                {{ content }}</textarea
                >
            </p>

            <p>
                Rarity:
                <br />
                <select name="rarity">
                    <option value="C">C</option>
                    <option value="U">U</option>
                    <option value="R">R</option>
                    <option value="UR">UR</option>
                    <option value="SEC">SEC</option>
                    <option value="P">P</option>
                    <option value="SR">SR</option>
                </select>
            </p>

            <p>
                Set:
                <br />
                <select name="card_set">
                    <option value="BT1">BT1</option>
                    <option value="BT2">BT2</option>
                    <option value="BT3">BT3</option>
                </select>
            </p>

            <p>
                Card number suffix (e.g. 001):
                <br />
                <input
                    type="text"
                    name="card_number_suffix"
                    pattern="\d*"
                    maxlength="6"
                />
            </p>

            <input type="hidden" name="target" value="{{ target }}" />
            <p>
                <input type="submit" value="Send" />
            </p>
        </form>
    </body>
</html>
