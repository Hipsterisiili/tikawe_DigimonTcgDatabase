<!doctype html>

<!-- 
A page for a form, which allows user to edit items in the database.
If target = public, cards are edited from the public table   
If target = private, cards are edited from the user's personal table
Cards are identified by their unique id number, which is separate from the card_id
The data given by the user is used for updating the item in database
User alter the following info on the card: 
- Card's name
- Card's rarity (C, U, R, P, UR, SR or SEC)
- Card's card id, which consists of set number and a suffix such as BT1-001 or EX8-111
-->

<html>
    <head>
        <title>
            Edit an existing card a card in {{ 'personal' if target=='personal'
            else 'global' }} collection
        </title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>

    {% with messages = get_flashed_messages() %} {% if messages %}
    <ul class="flashes">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %} {% endwith %}

    <div class="container">
        <!-- Form for editing an existing card -->
        <form action="/edit_card" method="post">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ session.csrf_token }}"
            />
            <input type="hidden" name="id" value="{{ id }}" />
            <input type="hidden" name="target" value="{{ target }}" />
            <p>
                Name of the card:
                <br />
                <textarea name="card_name" rows="3" cols="40">
                {{- card_name|e -}}
                </textarea>
            </p>

            <p>
                Rarity:
                <br />
                <select name="rarity">
                    {% for r in rarities %} {% if rarity == r %}
                    <option value="{{ r }}" selected>{{ r }}</option>
                    {% else %}
                    <option value="{{ r }}">{{ r }}</option>
                    {% endif %} {% endfor %}
                </select>
            </p>

            <p>
                Set:
                <br />
                <select name="card_set">
                    {% for val in sets %} {% if val == card_set %}
                    <option value="{{ val }}" selected>{{ val }}</option>
                    {% else %}
                    <option value="{{ val }}">{{ val }}</option>
                    {% endif %} {% endfor %}
                </select>
            </p>

            <p>
                Card number suffix (e.g. 001):
                <br />
                <input
                    type="text"
                    name="card_number_suffix"
                    inputmode="numeric"
                    pattern="^\d{1,6}$"
                    maxlength="6"
                    value="{{ card_number_suffix|default('001')|e }}"
                />
            </p>

            <input type="hidden" name="target" value="{{ target }}" />
            <p>
                <input type="submit" value="Send" />
            </p>
        </form>
    </div>
</html>
