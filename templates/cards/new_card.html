<!doctype html>
<!-- 
A page for a form, which allows user to add items to database.
If target = public, cards are added to the public table.
If target = private, cards are added to the user's personal table.
Cards are identified by their unique id number, which is separate from the card_id
User specifies following info on the card: 
- Card's name
- Card's rarity (C, U, R, P, UR, SR or SEC)
- Card's card id, which consists of set number and a suffix such as BT1-001 or EX8-111
-->
<html>
    <head>
        <title>
            Add a card to {{ 'personal' if target=='personal' else 'global' }}
            collection
        </title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>

    {% with messages = get_flashed_messages() %} {% if messages %}
    <ul class="flashes">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %} {% endwith %}

    <div class="container">
        <!-- Form for adding a new card -->
        <form action="/send_card" method="post">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ session.csrf_token }}"
            />
            <p>
                Name of the card:
                <br />
                <textarea name="card_name" rows="3" cols="40">
                {{- default_name|e -}}
                </textarea>
            </p>

            <p>
                Rarity:
                <br />
                <select name="rarity">
                    {% for r in ['C','U','R','UR','SEC','P','SR'] %} {% if r ==
                    default_rarity %}
                    <option value="{{ r }}" selected>{{ r }}</option>
                    {% else %}
                    <option value="{{ r }}">{{ r }}</option>
                    {% endif %} {% endfor %}
                </select>
            </p>

            <p>
                Set:
                <br />
                <select name="card_set">
                    {% for val in sets %} {% if val == current_set %}
                    <option value="{{ val }}" selected>{{ val }}</option>
                    {% else %}
                    <option value="{{ val }}">{{ val }}</option>
                    {% endif %} {% endfor %}
                </select>
            </p>

            <p>
                Card number suffix (for example 001):
                <br />
                <input
                    type="text"
                    name="card_number_suffix"
                    pattern="\d{1,6}"
                    maxlength="6"
                    inputmode="numeric"
                    value="{{ default_suffix|e }}"
                />
            </p>

            <input type="hidden" name="target" value="{{ target }}" />
            <p>
                <input type="submit" value="Send" />
            </p>
        </form>
    </div>
</html>
