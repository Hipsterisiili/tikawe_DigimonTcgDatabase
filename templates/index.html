<!DOCTYPE html>
<html>

<head>
  <title>Etusivu</title>
</head>

<body>
  <p>
    Tervetuloa Digimonkorttitietokantaan!
  </p>

  {% if session.username %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}
  </p>
  <p>
    <a href="/personal_card_list">Henkilökohtainen kokoelmasi</a>
  </p>
  <p>
    <a href="/logout">Kirjaudu ulos</a>
  </p>
  {% else %}
  <p>
    Et ole vielä kirjautunut sisään
    <p>
      <a href="/login">Kirjaudu sisään</a>
      <p>
        <a href="/register">Luo tunnus</a>
      </p>
    </p>
  </p>
  {% endif %}

  <p>
    <a href="/full_card_list">Koko korttitietokanta</a>
  </p>
</body>

</html>
